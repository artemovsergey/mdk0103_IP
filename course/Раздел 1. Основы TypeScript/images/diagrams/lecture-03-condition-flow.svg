<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Поток условного выбора состояния экрана</title>
  <desc id="desc">Значение состояния проверяется последовательно, и программа выполняет первую подходящую ветку, иначе выбирает запасную ветку.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Условие — это маршрут, а не декорация</text>
  <g filter="url(#shadow)">
    <rect x="55" y="210" width="155" height="105" rx="52" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="132" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">Состояние</text>
    <text x="132" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">networkState</text>
  </g>
  <path d="M210 262 H275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="280" y="90" width="190" height="80" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="375" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">offline?</text>
    <text x="375" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">если да — стоп</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="280" y="225" width="190" height="80" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <text x="375" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">slow?</text>
    <text x="375" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">если да — предупредить</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="280" y="360" width="190" height="80" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="375" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">иначе online</text>
    <text x="375" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">обычный режим</text>
  </g>
  <path d="M210 262 C240 262 245 130 275 130" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M375 170 V220" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M210 262 H275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M375 305 V355" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M210 262 C240 262 245 400 275 400" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M470 130 H600" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M470 265 H600" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M470 400 H600" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="605" y="190" width="300" height="150" rx="20" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text x="755" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Результат</text>
    <text x="755" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">одна выбранная ветка</text>
    <text x="755" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">остальные пропущены</text>
  </g>
  <text x="480" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Порядок условий отражает приоритет: более специфичные случаи ставятся раньше общих.</text>
</svg>
