<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Путь вызова функции</title>
  <desc id="desc">Аргументы вызова связываются с параметрами функции, тело вычисляет результат, а return передаёт его вызывающему коду.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Вызов функции как небольшой конвейер</text>
  <g filter="url(#shadow)">
    <rect x="45" y="200" width="165" height="115" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="127" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Вызывающий код</text>
    <text x="127" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">formatPrice(...)</text>
  </g>
  <path d="M210 257 H285" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="290" y="120" width="185" height="90" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="382" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">Аргументы</text>
    <text x="382" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">1500, "₽"</text>
  </g>
  <path d="M382 210 V255" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="290" y="260" width="185" height="120" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="382" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Параметры</text>
    <text x="382" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">amount</text>
    <text x="382" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">currency</text>
  </g>
  <path d="M475 320 H535" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="540" y="245" width="170" height="150" rx="18" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <text x="625" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#047857">Тело функции</text>
    <text x="625" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">вычисления</text>
    <text x="625" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">и проверки</text>
  </g>
  <path d="M710 290 C760 240 775 200 810 200" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="815" y="150" width="115" height="100" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="872" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b45309">return</text>
    <text x="872" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">результат</text>
  </g>
  <path d="M872 250 C820 320 320 350 210 285" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Каждый вызов создаёт новые значения параметров; тело функции работает с ними локально.</text>
</svg>
