<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Сужение объединённого типа</title>
  <desc id="desc">Объединение string и number проверяется проверками на каждом пути, после чего в каждой ветке остаётся только применимый тип.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Проверка не меняет значение — она уточняет его тип</text>
  <g filter="url(#shadow)">
    <rect x="45" y="205" width="205" height="125" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="147" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Значение</text>
    <text x="147" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">string | number</text>
  </g>
  <path d="M250 267 H325" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M450 135 H590 L635 267 L590 400 H450 L405 267 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="520" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">Проверка</text>
    <text x="520" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">typeof / ===</text>
  </g>
  <path d="M635 220 C695 180 715 155 755 155" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M635 315 C695 355 715 385 755 385" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="760" y="105" width="165" height="110" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="842" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">string</text>
    <text x="842" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">методы строки</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="340" width="165" height="110" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="842" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#047857">number</text>
    <text x="842" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">арифметика</text>
  </g>
  <text x="480" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">TypeScript анализирует поток управления и убирает из объединения невозможные варианты.</text>
</svg>
