<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Выбор формы функции в TypeScript</title>
  <desc id="desc">Дерево решения помогает выбрать объявление функции, функциональное выражение или стрелочную функцию с учётом читаемости и контекста.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Форма функции — решение о читаемости</text>
  <g filter="url(#shadow)">
    <rect x="330" y="85" width="300" height="85" rx="42" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="480" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">Нужно ли объявление</text>
    <text x="480" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">на верхнем уровне?</text>
  </g>
  <path d="M400 170 C300 205 235 215 190 255" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="260" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">да</text>
  <g filter="url(#shadow)">
    <rect x="55" y="260" width="250" height="120" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="180" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">function</text>
    <text x="180" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">явное имя и тело</text>
  </g>
  <path d="M560 170 C660 205 725 215 770 255" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="700" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">нет</text>
  <g filter="url(#shadow)">
    <rect x="655" y="260" width="250" height="120" rx="20" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <text x="780" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#047857">Стрелочная функция</text>
    <text x="780" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">короткое значение</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="355" y="405" width="250" height="85" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="480" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">Проверь контекст</text>
    <text x="480" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">callback, this, this</text>
  </g>
  <path d="M305 320 C330 365 350 390 380 420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M655 320 C630 365 610 390 580 420" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Короткий код не всегда лучше: имя и явная форма часто важнее экономии строк.</text>
</svg>
