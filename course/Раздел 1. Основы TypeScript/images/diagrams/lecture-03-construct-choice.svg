<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Выбор условной конструкции</title>
  <desc id="desc">Схема сравнивает if, тернарный оператор и switch для выбора наиболее читаемой конструкции в разных ситуациях.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Не одна универсальная конструкция, а выбор по задаче</text>
  <g filter="url(#shadow)">
    <rect x="50" y="105" width="260" height="330" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="50" y="105" width="260" height="70" rx="24" fill="#2563eb"/>
    <rect x="50" y="145" width="260" height="30" fill="#2563eb"/>
    <text x="180" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">if / else</text>
    <text x="180" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Когда нужны действия</text>
    <text x="180" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">несколько условий</text>
    <text x="180" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">логические комбинации</text>
    <text x="180" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">сложные сообщения</text>
    <text x="180" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">базовый инструмент</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="105" width="260" height="330" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <rect x="350" y="105" width="260" height="70" rx="24" fill="#7c3aed"/>
    <rect x="350" y="145" width="260" height="30" fill="#7c3aed"/>
    <text x="480" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">?:</text>
    <text x="480" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Когда нужно значение</text>
    <text x="480" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">ровно два варианта</text>
    <text x="480" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">короткие выражения</text>
    <text x="480" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">без побочных эффектов</text>
    <text x="480" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">компактный выбор</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="105" width="260" height="330" rx="24" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <rect x="650" y="105" width="260" height="70" rx="24" fill="#059669"/>
    <rect x="650" y="145" width="260" height="30" fill="#059669"/>
    <text x="780" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">switch</text>
    <text x="780" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Когда есть варианты</text>
    <text x="780" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">конкретные значения</text>
    <text x="780" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">общая логика случаев</text>
    <text x="780" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">понятная метка default</text>
    <text x="780" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">таблица вариантов</text>
  </g>
  <text x="480" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Сначала опишите решение словами, затем выберите синтаксис, который лучше отражает эти слова.</text>
</svg>
