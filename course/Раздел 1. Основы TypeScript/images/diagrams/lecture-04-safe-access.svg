<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Безопасный доступ к вложенному значению</title>
  <desc id="desc">Оператор необязательной цепочки проверяет промежуточное значение, продолжает доступ при наличии данных и возвращает undefined при отсутствии.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Безопасная цепочка останавливается без аварии</text>
  <g filter="url(#shadow)">
    <rect x="45" y="210" width="180" height="110" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="135" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">profile</text>
    <text x="135" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">объект или null</text>
  </g>
  <path d="M225 265 H285" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="290" y="200" width="150" height="130" rx="65" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="365" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#6d28d9">?.</text>
    <text x="365" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">проверка</text>
  </g>
  <path d="M440 265 H515" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="520" y="90" width="210" height="135" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="625" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">Значение есть</text>
    <text x="625" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">продолжаем цепочку</text>
    <text x="625" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">profile.name</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="330" width="210" height="135" rx="20" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="625" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b45309">Нет значения</text>
    <text x="625" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">останавливаемся</text>
    <text x="625" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">результат undefined</text>
  </g>
  <path d="M365 330 C365 300 500 300 590 260" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M365 330 C380 430 470 430 560 425" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="840" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Затем ??</text>
  <text x="840" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">подставляет запасной</text>
  <text x="840" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">текст</text>
  <text x="480" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">?. защищает путь доступа, ?? выбирает значение для интерфейса.</text>
</svg>
