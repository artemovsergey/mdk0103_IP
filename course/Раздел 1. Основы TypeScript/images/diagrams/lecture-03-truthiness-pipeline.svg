<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Проверка истинности значения</title>
  <desc id="desc">Разные значения проходят через правила истинности JavaScript и превращаются в логическое true или false, а затем в ветку программы.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Истинность: не то же самое, что наличие</text>
  <g filter="url(#shadow)">
    <rect x="45" y="190" width="170" height="150" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="130" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Значение</text>
    <text x="130" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">0, "", null,</text>
    <text x="130" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">undefined</text>
  </g>
  <path d="M215 265 H290" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M405 165 H555 L600 265 L555 365 H405 L360 265 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="480" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">Неявное</text>
    <text x="480" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#6d28d9">приведение</text>
  </g>
  <path d="M600 265 H665" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="670" y="100" width="230" height="115" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="785" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#047857">false</text>
    <text x="785" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">ветка else</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="670" y="320" width="230" height="115" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="785" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">true</text>
    <text x="785" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">ветка if</text>
  </g>
  <path d="M785 215 V310" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Если 0 или пустая строка допустимы, проверяйте наличие явно, а не полагайтесь на истинность.</text>
</svg>
