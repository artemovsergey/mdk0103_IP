<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Контракт функции</title>
  <desc id="desc">Имя, параметры, типы и возвращаемый тип образуют контракт функции, понятный вызывающему коду и редактору.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Контракт: что функция принимает и что возвращает</text>
  <g filter="url(#shadow)">
    <rect x="70" y="115" width="820" height="275" rx="26" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="70" y="115" width="820" height="62" rx="26" fill="#2563eb"/>
    <rect x="70" y="145" width="820" height="32" fill="#2563eb"/>
    <text x="480" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">formatNotice</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="115" y="220" width="190" height="105" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="210" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">recipient: string</text>
    <text x="210" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">обязательный вход</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="385" y="220" width="190" height="105" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="480" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">message: string</text>
    <text x="480" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">содержание</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="655" y="220" width="190" height="105" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="750" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">string</text>
    <text x="750" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">возвращаемый тип</text>
  </g>
  <text x="160" y="360" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Вызывающий код:</text>
  <text x="160" y="393" font-family="Arial, sans-serif" font-size="17" fill="#334155">formatNotice("Мария", "Готово")</text>
  <g filter="url(#shadow)">
    <rect x="130" y="425" width="700" height="68" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="480" y="467" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">Редактор проверяет вызов до запуска программы</text>
  </g>
</svg>
