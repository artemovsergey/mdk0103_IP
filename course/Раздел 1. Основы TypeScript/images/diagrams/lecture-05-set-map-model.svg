<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Модель множества и словаря</title>
  <desc id="desc">Слева множество сохраняет уникальные значения, справа словарь связывает уникальные ключи с соответствующими значениями.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Set хранит значения, Map хранит отношения</text>
  <g filter="url(#shadow)">
    <rect x="45" y="95" width="395" height="380" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <text x="242" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#6d28d9">Set&lt;string&gt;</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="140" cy="215" r="45" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="140" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">космос</text>
    <circle cx="270" cy="215" r="45" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="270" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">наука</text>
    <circle cx="200" cy="330" r="45" fill="#fff1f2" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="200" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">космос</text>
    <text x="200" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">повтор не сохраняется</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="95" width="395" height="380" rx="24" fill="#ffffff" stroke="#059669" stroke-width="3"/>
    <text x="717" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#047857">Map&lt;string, number&gt;</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="565" y="185" width="135" height="75" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="632" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Земля</text>
    <text x="632" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">1</text>
    <rect x="735" y="185" width="135" height="75" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="802" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Марс</text>
    <text x="802" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">2</text>
    <path d="M700 223 H730" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="717" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">ключ → значение</text>
    <text x="717" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">ключи уникальны</text>
    <text x="717" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">значения могут повторяться</text>
  </g>
  <text x="480" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Для Many-to-many нужны другие структуры, но на базовом уровне Set и Map закрывают большинство задач.</text>
</svg>
