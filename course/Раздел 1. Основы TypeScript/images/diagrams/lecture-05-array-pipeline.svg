<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Конвейер обработки массива</title>
  <desc id="desc">Массив проходит через map для преобразования, filter для отбора и reduce для сведения к одному значению.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Коллекция остаётся источником новых коллекций</text>
  <g filter="url(#shadow)">
    <rect x="40" y="195" width="180" height="145" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="130" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Исходный</text>
    <text x="130" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Array</text>
    <text x="130" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">данные заказа</text>
  </g>
  <path d="M220 267 H300" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="305" y="130" width="170" height="115" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="390" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">map</text>
    <text x="390" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">новый массив</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="305" y="315" width="170" height="115" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="390" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">filter</text>
    <text x="390" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">подборка</text>
  </g>
  <path d="M475 187 C525 187 525 255 565 255" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M475 372 C525 372 525 290 565 290" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="570" y="210" width="170" height="135" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="655" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#047857">reduce</text>
    <text x="655" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">итоговое число</text>
  </g>
  <path d="M740 277 H815" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="820" y="220" width="110" height="115" rx="55" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="875" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309">Итог</text>
    <text x="875" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">2850 ₽</text>
  </g>
  <text x="480" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Сначала выбирайте операцию по вопросу: преобразовать, отобрать или посчитать.</text>
</svg>
