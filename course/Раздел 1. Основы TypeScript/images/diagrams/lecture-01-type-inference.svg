<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Как TypeScript выводит тип переменной</title>
  <desc id="desc">Начальное значение, контекст и объявление поступают в систему типов, которая формирует тип переменной и сигналы редактора.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Вывод типа: решение по имеющимся данным</text>
  <g filter="url(#shadow)">
    <rect x="55" y="110" width="220" height="100" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="165" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Начальное значение</text>
    <text x="165" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">const count = 2</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="55" y="330" width="220" height="100" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <text x="165" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Контекст</text>
    <text x="165" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">параметр функции</text>
  </g>
  <path d="M275 160 C350 160 360 230 420 230" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M275 380 C350 380 360 290 420 290" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <path d="M420 145 L585 145 L640 260 L585 375 L420 375 L365 260 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="502" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d4ed8">Система типов</text>
    <text x="502" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">проверяет и уточняет</text>
    <text x="502" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">допустимые значения</text>
  </g>
  <path d="M640 260 H720" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="725" y="200" width="190" height="120" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="820" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#047857">Тип переменной</text>
    <text x="820" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">number</text>
  </g>
  <path d="M820 320 V405" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="700" y="410" width="240" height="75" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="820" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">Подсказки редактора</text>
  </g>
  <text x="480" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Явная аннотация нужна, когда вывод невозможен или контракт должен быть виден читателю.</text>
</svg>
